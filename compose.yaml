services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////./app/data/database.db"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads

volumes:
  app_data:
  app_uploads: